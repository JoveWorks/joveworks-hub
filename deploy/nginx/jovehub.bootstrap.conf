# Temporary HTTP-only virtual host. Install this first so Certbot can perform
# its HTTP-01 challenge, then replace it with jovehub.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name jovehub.thomasvanriel.com;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
