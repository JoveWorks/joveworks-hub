upstream joveworks_hub {
    server 127.0.0.1:8083;
}

server {
    listen 80;
    listen [::]:80;
    server_name jovehub.thomasvanriel.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jovehub.thomasvanriel.com;

    ssl_certificate /etc/letsencrypt/live/jovehub.thomasvanriel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jovehub.thomasvanriel.com/privkey.pem;

    # These snippets are part of this server's existing Nginx setup.
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;
    include snippets/geo-block.conf;

    client_max_body_size 1m;
    access_log /var/log/nginx/jovehub-access.log;
    error_log /var/log/nginx/jovehub-error.log;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://joveworks_hub;
    }
}
